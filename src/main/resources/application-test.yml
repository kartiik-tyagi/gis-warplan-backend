spring:
  datasource:
    url: jdbc:h2:mem:gis_warplan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  kafka:
    listener:
      auto-startup: false

warplan:
  db:
    auto-create: false
  icons:
    root: target/test-icons

logging:
  config: config/gis-warplan.xml
