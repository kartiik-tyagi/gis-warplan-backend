# Prod profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# This file configures the API only. The UI is a separate build.
# When the UI is on another origin, set WARPLAN_CORS_ORIGINS to that origin
# (comma-separated if there is more than one).
server:
  address: 0.0.0.0

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gis_warplan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

warplan:
  db:
    auto-create: true
  cors-origins: "${WARPLAN_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}"

logging:
  config: /etc/coraltelecom/gis-warplan.xml
