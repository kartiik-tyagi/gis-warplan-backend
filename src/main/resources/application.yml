spring:
  application:
    name: gis-warplan-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gis_warplan}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # NOTE: update never renames/drops. After schema-lock changes (scenario/game fields, audit/session),
      # drop database gis_warplan once and restart (no migration files; see docs/SCHEMA-LOCK.md).
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: 8091
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

warplan:
  api-base-path: /api/v1
  cors-origins:
    - http://127.0.0.1:5173
  db:
    auto-create: true
  jwt:
    secret: ${WARPLAN_JWT_SECRET:change-me}
    expiration: 90000
  icons:
    root: images/icon
  attachments:
    root: images/scenario-attachments

logging:
  config: config/gis-warplan.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: GIS Warplan
    description: GIS Warplan backend

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
